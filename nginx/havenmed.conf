# ─────────────────────────────────────────────────────────────────────────────
# HavenMED — Nginx configuration
# Listens on :80 inside Docker (mapped to host port 4545)
# Proxies to Gunicorn on havenmed_app:8000
# Serves /static/ and /media/ directly from volume mounts
# ─────────────────────────────────────────────────────────────────────────────

upstream havenmed_app {
    server app:8000;
    keepalive 32;
}

# Rate limiting zone — 10 req/s per IP
limit_req_zone $binary_remote_addr zone=havenmed_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;          # Accept any host header (update with real domain in prod)

    charset utf-8;
    client_max_body_size 20M;   # Allow up to 20 MB uploads (medical docs)

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin"    always;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/havenmed_access.log combined;
    error_log  /var/log/nginx/havenmed_error.log  warn;

    # ── Health check (used by Docker healthcheck & load balancers) ────────
    location = /health/ {
        proxy_pass         http://havenmed_app;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Static files — served directly by Nginx ──────────────────────────
    location /static/ {
        alias      /app/staticfiles/;
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # ── Media files — served directly by Nginx ───────────────────────────
    location /media/ {
        alias      /app/media/;
        expires    7d;
        add_header Cache-Control "public";
        access_log off;

        # Block direct access to sensitive document uploads
        location ~* /media/documents/ {
            deny all;
            return 403;
        }
    }

    # ── All other requests → Gunicorn ─────────────────────────────────────
    location / {
        limit_req zone=havenmed_limit burst=20 nodelay;

        proxy_pass         http://havenmed_app;

        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer settings
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         8 16k;
    }

    # ── Block common attack vectors ───────────────────────────────────────
    location ~* \.(env|git|sql|bak|sh)$ {
        deny all;
        return 404;
    }

    # ── Custom error pages ────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
