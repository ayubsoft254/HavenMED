# External Nginx vhost for HavenMED
# Use this on the Linux host where Nginx is already installed.
# This file is safe alongside other vhosts because it does not use default_server.

upstream havenmed_upstream {
    server 127.0.0.1:18000;
    keepalive 32;
}

server {
    listen 80;
    server_name havenmed.example.com www.havenmed.example.com;

    client_max_body_size 20M;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin" always;

    access_log /var/log/nginx/havenmed_access.log;
    error_log /var/log/nginx/havenmed_error.log warn;

    location = /health/ {
        proxy_pass http://havenmed_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    location /static/ {
        alias /opt/havenmed/shared/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/havenmed/shared/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://havenmed_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
