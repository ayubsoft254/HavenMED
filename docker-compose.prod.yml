services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: havenmed-app:prod
    container_name: havenmed_app_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      SQLITE_PATH: /data/db.sqlite3
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
             --log-level info"
    volumes:
      - ${HOST_DATA_DIR:-/opt/havenmed/shared/data}:/data
      - ${HOST_MEDIA_DIR:-/opt/havenmed/shared/media}:/app/media
      - ${HOST_STATIC_DIR:-/opt/havenmed/shared/staticfiles}:/app/staticfiles
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
